  <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📇 Flashcard Quiz App - HorizonTechX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📇 Flashcard Quiz App</h1>
            <p>HorizonTechX - Learn & Master</p>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="study">📖 Study</button>
            <button class="tab-btn" data-tab="add">➕ Add Card</button>
            <button class="tab-btn" data-tab="manage">⚙️ Manage</button>
        </div>
        
        <div class="tab-content active" id="study">
            <div id="studyContent"></div>
        </div>
        
        <div class="tab-content" id="add">
            <h3>➕ Add New Card</h3>
            <form id="addForm">
                <div class="form-group">
                    <label>Question / Term</label>
                    <textarea id="question" placeholder="Enter your question..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Answer / Definition</label>
                    <textarea id="answer" placeholder="Enter the answer..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Flashcard</button>
            </form>
        </div>
        
        <div class="tab-content" id="manage">
            <h3>⚙️ Manage Cards</h3>
            <div id="manageContent"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
